# Host-nginx site for E-Katalog on a VPS where nginx + certbot already own 80/443.
# Storefront + admin (Next.js) on 127.0.0.1:3002; API (Go) same-origin under /api/.
# Install:  sudo cp ekatalog.conf /etc/nginx/sites-available/ekatalog
#           sudo ln -sf /etc/nginx/sites-available/ekatalog /etc/nginx/sites-enabled/ekatalog
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d ekatalog.vandev.my.id   # adds the TLS block
server {
    listen 80;
    listen [::]:80;
    server_name ekatalog.vandev.my.id;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # API (Go backend). Browser calls https://<domain>/api/v1/... → backend /api/v1/...
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Storefront + admin (Next.js).
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
