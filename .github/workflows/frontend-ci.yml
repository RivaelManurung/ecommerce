name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The build only needs a placeholder; the real API URL is set per-env at
      # runtime (NEXT_PUBLIC_API_BASE_URL / INTERNAL_API_BASE_URL on the host).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Typecheck + build are the hard gates (must pass).
      - name: Typecheck
        run: npx tsc --noEmit

      # Lint is reported but non-blocking: a few intentional client-only
      # post-mount state reads trip react-hooks/set-state-in-effect.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
