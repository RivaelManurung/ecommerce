name: Deploy to VPS

# Runs after images are published to GHCR (push to main), or manually.
# Ships the latest compose file to the VPS deploy dir and rolls the stack with
# docker compose pull + up. The server's .env is kept untouched. Host nginx +
# certbot (already on the box) terminate TLS for ekatalog.vandev.my.id.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
#   VPS_PORT   (optional, default 22)
#   GHCR_USER, GHCR_TOKEN  (PAT with read:packages — to pull private GHCR images)
# Required repo variable:
#   API_DOMAIN = ekatalog.vandev.my.id

on:
  workflow_run:
    workflows: ["Docker Publish (GHCR)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    # Auto-deploy only if the publish succeeded; manual runs always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Ship the latest compose to the VPS deploy dir (keeps .env untouched).
      - name: Copy compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.vps.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_PREFIX,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Private GHCR packages need a login; public ones don't.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            export IMAGE_PREFIX IMAGE_TAG
            docker compose -f docker-compose.vps.yml pull
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.vps.yml ps
        env:
          IMAGE_PREFIX: ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
