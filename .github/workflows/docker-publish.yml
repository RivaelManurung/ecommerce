name: Docker Publish (GHCR)

# Builds the backend + frontend images and pushes them to GHCR on every push to
# main (or manually). The "Deploy to VPS" workflow then rolls them onto the VPS.
# Backend lives in a submodule (RivaelManurung/backend-ecommerce) — we check it
# out with submodules: recursive so its source is present for the build.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend"
      - ".gitmodules"
      - "deploy/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Lowercase owner
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-${{ matrix.name }}:${{ github.sha }}
          # Only the frontend consumes this build-arg (harmless for the backend).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ vars.API_DOMAIN }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
