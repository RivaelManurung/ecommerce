name: Deploy (VPS)

# Builds backend + frontend images, pushes them to GHCR, then SSHes into the VPS
# and rolls the docker-compose stack. Opt-in:
#   • Manual: Actions → "Deploy (VPS)" → Run workflow.
#   • On push to main: set repo variable VPS_DEPLOY_ENABLED=true.
#
# Repo variables (Settings → Variables):
#   API_DOMAIN            — public API domain, baked into the frontend bundle
#   VPS_DEPLOY_ENABLED    — "true" to deploy on push (optional)
# Secrets (Settings → Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (opt), VPS_DEPLOY_PATH
#   GHCR_TOKEN, GHCR_USER — only if GHCR packages are private (read:packages PAT)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VPS_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-${{ matrix.name }}:${{ github.sha }}
          # Only the frontend uses this; harmless for the backend build.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ vars.API_DOMAIN }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Ship the latest compose + Caddyfile to the VPS (the server's .env is kept).
      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH,BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Private GHCR packages need a login; public ones don't.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            export BACKEND_IMAGE FRONTEND_IMAGE
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          BACKEND_IMAGE: ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.ns.outputs.owner }}/ekatalog-frontend:${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
